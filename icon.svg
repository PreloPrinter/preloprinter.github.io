<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Prelo: a printing press. Cream paper tile, the heavy platen and screw in ink, a slip coming out, headline-red light. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/><stop offset="1" stop-color="#E9E3D6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2E"/><stop offset="1" stop-color="#121214"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.2" fill="#121214" opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#121214" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- tile (macOS rounds it; keep the art inside the safe area) -->
  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#dots)"/>
  <!-- slip of paper coming out under the platen -->
  <g filter="url(#shadow)">
    <path d="M312 540h400v300l-25 25-25-25-25 25-25-25-25 25-25-25-25 25-25-25-25 25-25-25-25 25-25-25-25 25-25-25-25 25-25-25-25 25-25-25z" fill="#FBF9F3"/>
  </g>
  <rect x="352" y="590" width="200" height="22" rx="6" fill="#121214"/>
  <rect x="352" y="640" width="300" height="22" rx="6" fill="#121214"/>
  <rect x="352" y="690" width="240" height="22" rx="6" fill="#121214"/>
  <rect x="352" y="740" width="150" height="22" rx="6" fill="#B91C1C"/>
  <!-- the press: screw, knob, arm, platen -->
  <rect x="488" y="150" width="48" height="140" rx="10" fill="url(#ink)"/>
  <rect x="330" y="128" width="364" height="52" rx="26" fill="url(#ink)"/>
  <circle cx="330" cy="154" r="44" fill="#121214"/>
  <circle cx="694" cy="154" r="44" fill="#121214"/>
  <rect x="400" y="268" width="224" height="40" rx="12" fill="#121214"/>
  <rect x="236" y="300" width="552" height="150" rx="40" fill="url(#ink)" filter="url(#shadow)"/>
  <rect x="236" y="430" width="552" height="60" rx="18" fill="#121214"/>
  <!-- the light -->
  <circle cx="716" cy="375" r="22" fill="#B91C1C"/>
  <circle cx="716" cy="375" r="34" fill="none" stroke="#B91C1C" stroke-opacity=".35" stroke-width="10"/>
  <!-- name plate -->
  <rect x="300" y="352" width="160" height="46" rx="12" fill="#FBF9F3"/>
  <rect x="320" y="368" width="70" height="14" rx="5" fill="#121214"/>
</svg>
